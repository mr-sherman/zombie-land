<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Courier New', monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#16210f"/>
      <stop offset="100%" stop-color="#0b0e0c"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- browser window -->
  <g stroke="#2f4a2a" stroke-width="3" fill="#0d120c">
    <rect x="130" y="80" width="1020" height="560"/>
    <rect x="130" y="80" width="1020" height="46" fill="#121a10"/>
  </g>
  <g fill="#0b0e0c" stroke="#4a5c44" stroke-width="2">
    <circle cx="164" cy="103" r="7"/><circle cx="190" cy="103" r="7"/><circle cx="216" cy="103" r="7"/>
  </g>
  <!-- dead tab + url bar -->
  <rect x="250" y="90" width="230" height="36" fill="#0d120c" stroke="#2f4a2a" stroke-width="2"/>
  <text x="266" y="114" fill="#4a5c44" font-size="16">dead-internet.html</text>
  <g stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round">
    <line x1="452" y1="102" x2="464" y2="114"/><line x1="464" y1="102" x2="452" y2="114"/>
  </g>
  <rect x="510" y="94" width="560" height="28" rx="14" fill="#0b0e0c" stroke="#2f4a2a" stroke-width="2"/>
  <text x="532" y="114" fill="#4a5c44" font-size="15">https://www.the-real-internet.com/ (connection lost)</text>

  <!-- flatline heartbeat -->
  <polyline points="150,560 330,560 360,560 380,520 400,600 420,470 445,640 470,560 500,560 1130,560"
            fill="none" stroke="#7cff6b" stroke-opacity="0.22" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="150,560 330,560 360,560 380,520 400,600 420,470 445,640 470,560 500,560 1130,560"
            fill="none" stroke="#7cff6b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1130" y="600" fill="#ff6b6b" font-size="18" text-anchor="end">NO PULSE</text>

  <!-- glitch bars -->
  <g>
    <rect x="130" y="190" width="420" height="10" fill="#7cff6b" opacity="0.18"/>
    <rect x="160" y="203" width="300" height="4" fill="#ff6b6b" opacity="0.30"/>
    <rect x="800" y="250" width="350" height="12" fill="#7cff6b" opacity="0.15"/>
    <rect x="770" y="266" width="260" height="4" fill="#ff6b6b" opacity="0.28"/>
    <rect x="130" y="420" width="260" height="8" fill="#ff6b6b" opacity="0.20"/>
    <rect x="900" y="440" width="250" height="10" fill="#7cff6b" opacity="0.18"/>
    <rect x="870" y="453" width="180" height="4" fill="#ff6b6b" opacity="0.26"/>
  </g>

  <!-- scanlines -->
  <rect width="1280" height="720" fill="url(#scan)"/>
</svg>
