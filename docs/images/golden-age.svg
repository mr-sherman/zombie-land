<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="'Courier New', monospace">
  <rect width="1100" height="330" fill="#0b0e0c"/>

  <!-- timeline -->
  <line x1="60" y1="160" x2="1080" y2="160" stroke="#4a5c44" stroke-width="3"/>

  <!-- stems -->
  <g stroke="#2f4a2a" stroke-width="2">
    <line x1="110" y1="138" x2="110" y2="160"/>
    <line x1="541" y1="138" x2="541" y2="160"/>
    <line x1="854" y1="138" x2="854" y2="160"/>
    <line x1="384" y1="160" x2="384" y2="182"/>
    <line x1="482" y1="160" x2="482" y2="182"/>
    <line x1="737" y1="160" x2="737" y2="182"/>
    <line x1="1050" y1="160" x2="1050" y2="182"/>
  </g>

  <!-- dots -->
  <g fill="#0b0e0c" stroke="#7cff6b" stroke-width="3">
    <circle cx="110" cy="160" r="9"/>
    <circle cx="384" cy="160" r="9"/>
    <circle cx="482" cy="160" r="9"/>
    <circle cx="541" cy="160" r="9"/>
    <circle cx="737" cy="160" r="9"/>
  </g>
  <circle cx="854" cy="160" r="10" fill="#ff6b6b" stroke="#ff6b6b"/>
  <circle cx="1050" cy="160" r="9" fill="#7cff6b" stroke="#7cff6b"/>

  <!-- above: 1978, 2000, 2016 -->
  <g text-anchor="middle">
    <text x="110" y="132" fill="#7cff6b" font-size="22" font-weight="bold">1978</text>
    <text x="110" y="80" fill="#8aff8a" font-size="16">First BBSs</text>
    <text x="110" y="102" fill="#7fae72" font-size="16">fakery on dial-up</text>

    <text x="541" y="132" fill="#7cff6b" font-size="22" font-weight="bold">2000</text>
    <text x="541" y="80" fill="#8aff8a" font-size="16">ILoveYou worm</text>
    <text x="541" y="102" fill="#7fae72" font-size="16">spreads by email</text>

    <text x="854" y="132" fill="#ff6b6b" font-size="22" font-weight="bold">2016</text>
    <text x="854" y="80" fill="#8aff8a" font-size="16">Russian bots,</text>
    <text x="854" y="102" fill="#7fae72" font-size="16">Cambridge Analytica</text>
  </g>

  <!-- below: 1992, 2010, 2026 -->
  <g text-anchor="middle">
    <text x="376" y="208" text-anchor="end" fill="#7cff6b" font-size="22" font-weight="bold">1992</text>
    <text x="376" y="234" text-anchor="end" fill="#8aff8a" font-size="16">Michelangelo virus</text>
    <text x="376" y="256" text-anchor="end" fill="#7fae72" font-size="16">goes viral on floppies</text>

    <text x="456" y="208" text-anchor="start" fill="#7cff6b" font-size="22" font-weight="bold">Late 90s</text>
    <text x="456" y="234" text-anchor="start" fill="#8aff8a" font-size="16">Nigerian scams</text>
    <text x="456" y="256" text-anchor="start" fill="#7fae72" font-size="16">arrive by email</text>

    <text x="737" y="208" fill="#7cff6b" font-size="22" font-weight="bold">2010</text>
    <text x="737" y="234" fill="#8aff8a" font-size="16">"Catfishing" gets</text>
    <text x="737" y="256" fill="#7fae72" font-size="16">its name</text>

    <text x="1050" y="208" fill="#7cff6b" font-size="22" font-weight="bold">2026</text>
    <text x="1050" y="234" fill="#8aff8a" font-size="16">Today</text>
    <text x="1050" y="256" fill="#7fae72" font-size="16">AI slop</text>
  </g>

  <!-- golden age bracket -->
  <g stroke="#4a5c44" stroke-width="2" fill="none">
    <line x1="110" y1="292" x2="854" y2="292"/>
    <line x1="110" y1="284" x2="110" y2="300"/>
    <line x1="854" y1="284" x2="854" y2="300"/>
  </g>
  <rect x="330" y="278" width="304" height="28" fill="#0b0e0c"/>
  <text x="482" y="298" fill="#7fae72" font-size="18" text-anchor="middle">The "golden age" ... where?</text>
  <text x="680" y="299" fill="#ff6b6b" font-size="24" font-weight="bold" text-anchor="middle">?</text>
</svg>
